# Servidor PRIVADO (10.10.10.2)
# Adaptador: Solo red interna (10.10.10.0/24) — no alcanzable desde la LAN
# Servicios: api_1, api_2 (FastAPI) + PostgreSQL
# Requiere .env con JWT_SECRET_KEY, API_KEY y credenciales de BD

services:
  postgres:
    image: postgres:15
    container_name: sway_postgres
    restart: always
    environment:
      POSTGRES_USER: sway_app
      POSTGRES_PASSWORD: sway123
      POSTGRES_DB: sway
      POSTGRES_HOST_AUTH_METHOD: trust
    command: postgres -c log_statement=all
    # Sin puertos expuestos al host — solo accesible por api_1 y api_2 internamente
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SWAY_PostgreSQL.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sway_app -d sway"]
      interval: 5s
      retries: 5
      timeout: 5s

  api_1:
    build: .
    container_name: sway_api_1
    restart: on-failure
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sway_app:sway123@postgres:5432/sway
    depends_on:
      postgres:
        condition: service_healthy

  api_2:
    build: .
    container_name: sway_api_2
    restart: on-failure
    ports:
      - "8002:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sway_app:sway123@postgres:5432/sway
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
