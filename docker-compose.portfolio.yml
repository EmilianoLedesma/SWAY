name: portfolio

services:
  portfolio-api:
    build: ./portfolio_api
    container_name: sway_portfolio_api
    restart: unless-stopped
    environment:
      PORTFOLIO_JWT_SECRET: ${PORTFOLIO_JWT_SECRET}
      PORTFOLIO_DB_PATH: /data/portfolio.db
    volumes:
      - portfolio_data:/data
    expose:
      - "8100"
    networks:
      - edge_network

# sway_edge_network is the auto-generated <project>_edge_network name from
# docker-compose.public.yml's own (directory-derived) project; if the droplet's
# checkout directory is ever renamed, this external network reference breaks
# silently. Known, accepted coupling — not fixed here.
networks:
  edge_network:
    name: sway_edge_network
    external: true

volumes:
  portfolio_data:
