# Servidor PÚBLICO (10.10.10.1)
# Adaptadores: Puente (LAN) + Red interna (10.10.10.0/24)
# Servicios: Nginx (reverse proxy + SSL + load balancer) + Uptime Kuma (monitoreo)
# NO requiere .env — solo los certificados en nginx/certs/

services:
  nginx:
    image: nginx:alpine
    container_name: sway_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/certs:/etc/nginx/certs:ro,z

  monitoring:
    image: louislam/uptime-kuma:1
    container_name: sway_monitoring
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  uptime_kuma_data:
