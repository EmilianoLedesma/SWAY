# ============================================================
# ARCHIVO DE REFERENCIA — configuración monolítica original
# Este compose ya NO se usa en producción.
# Usar en su lugar:
#   docker-compose.private.yml  → droplet privado
#   docker-compose.public.yml   → droplet público
# ============================================================

services:
  postgres:
    image: postgres:15
    container_name: sway_postgres
    restart: always
    environment:
      POSTGRES_USER: sway_app
      POSTGRES_PASSWORD: sway123
      POSTGRES_DB: sway
      POSTGRES_HOST_AUTH_METHOD: trust
    command: postgres -c log_statement=all
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SWAY_PostgreSQL.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sway_app -d sway"]
      interval: 5s
      retries: 5
      timeout: 5s

  api_1:
    build: .
    container_name: sway_api_1
    restart: on-failure
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sway_app:sway123@postgres:5432/sway
    depends_on:
      postgres:
        condition: service_healthy

  api_2:
    build: .
    container_name: sway_api_2
    restart: on-failure
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sway_app:sway123@postgres:5432/sway
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: sway_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/certs:/etc/nginx/certs:ro,z
    depends_on:
      - api_1
      - api_2

  monitoring:
    image: louislam/uptime-kuma:1
    container_name: sway_monitoring
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  postgres_data:
  uptime_kuma_data:
