server {
    listen 80;
    client_max_body_size 10M;

    location /portal/ {
        alias /usr/share/nginx/html/portal/;
        try_files $uri $uri/ /portal/index.html;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /portal/assets/ {
        alias /usr/share/nginx/html/portal/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /portfolio/ {
        alias /usr/share/nginx/html/portfolio/;
        try_files $uri $uri/ /portfolio/index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /jobtracker/ {
        alias /usr/share/nginx/html/jobtracker/;
        try_files $uri $uri/ /jobtracker/index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /portfolio-api/ {
        proxy_pass http://sway_portfolio_api:8100/portfolio-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
