events {
    worker_connections 1024;
}

http {
    # Las APIs viven en el servidor privado (10.10.10.2) — alcanzables por la red interna
    upstream sway_api {
        server 10.10.10.2:8001;
        server 10.10.10.2:8002;
    }

    # Redirige HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/sway.crt;
        ssl_certificate_key /etc/nginx/certs/sway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://sway_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
